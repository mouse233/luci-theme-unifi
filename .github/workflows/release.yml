name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - name: Validate the tag and changelog before running tests
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 tools/version.py --tag "$RELEASE_TAG"
          python3 tools/release_notes.py "$RELEASE_TAG" --allow-unreleased

  test:
    needs: validate
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - name: Validate the tag and changelog
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 tools/version.py --tag "$RELEASE_TAG"
          python3 tools/release_notes.py "$RELEASE_TAG" --allow-unreleased --output artifacts/release-notes.md
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: luci-theme-unifi-${{ github.sha }}
          path: artifacts/packages
      - name: Match the IPK version to the release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PYTHON'
          import io
          import os
          import re
          import sys
          import tarfile
          from pathlib import Path
          sys.path.insert(0, 'tools')
          from version import resolve_version
          expected = resolve_version(tag=os.environ['RELEASE_TAG'])
          revision = re.search(r'^PKG_RELEASE:=(\d+)$', Path('Makefile').read_text(), re.M)[1]
          version = expected['version'] + '-' + revision
          packages = list(Path('artifacts/packages').glob('*.ipk'))
          assert len(packages) == 1
          assert packages[0].name == f'luci-theme-unifi_{version}_all.ipk'
          with tarfile.open(packages[0], 'r:gz') as package:
              control_bytes = package.extractfile('./control.tar.gz').read()
          with tarfile.open(fileobj=io.BytesIO(control_bytes), mode='r:gz') as control:
              metadata = control.extractfile('./control').read().decode()
          assert re.search(r'^Package: luci-theme-unifi$', metadata, re.M)
          assert re.search(r'^Version: ' + re.escape(version) + '$', metadata, re.M)
          assert re.search(r'^Architecture: all$', metadata, re.M)
          PYTHON
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          assets=(artifacts/packages/*.ipk)
          if gh release view "$RELEASE_TAG" --json tagName > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
            if [[ -z "$(gh release view "$RELEASE_TAG" --json body --jq '.body')" ]]; then
              gh release edit "$RELEASE_TAG" --notes-file artifacts/release-notes.md
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" \
              --notes-file artifacts/release-notes.md "${flags[@]}" "${assets[@]}"
          fi
