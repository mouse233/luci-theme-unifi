name: Update vendor and icon data

on:
  schedule:
    - cron: '23 3 2 * *'
  workflow_dispatch:
    inputs:
      update_icons:
        description: Check the latest stable Simple Icons release
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: update-brand-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - name: Refresh official data, find icon candidates and compare Nmap
        env:
          UPDATE_ICONS: ${{ github.event_name == 'schedule' || inputs.update_icons }}
        run: |
          flags=()
          if [[ "$UPDATE_ICONS" == 'true' ]]; then flags+=(--update-icons); fi
          python3 tools/generate_brands.py --refresh --audit-nmap "${flags[@]}"
          python3 tools/generate_brands.py --check --audit-nmap
          cat artifacts/brand-data/update-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Validate generated data and package
        run: |
          node --test tests/*.test.cjs
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          git diff --check
      - name: Check rendered client inventory
        run: |
          npm ci
          npx playwright install --with-deps chromium
          python3 tools/preview_server.py > artifacts/brand-data/preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          python3 - <<'PY'
          import time
          import urllib.request
          for attempt in range(50):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8765/', timeout=1)
                  break
              except OSError:
                  time.sleep(0.1)
          else:
              raise SystemExit('Preview server did not start')
          PY
          node tests/client-ui-browser.cjs
      - name: Propose snapshot update
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ secrets.BRAND_DATA_TOKEN || github.token }}
          branch: automation/update-brand-data
          commit-message: 'chore: update vendor and icon data'
          title: 'Update vendor registry and brand icons'
          body-path: artifacts/brand-data/update-summary.md
          add-paths: |
            htdocs/luci-static/resources/unifi/vendor-data.js
            htdocs/luci-static/resources/unifi/brand-map.js
            htdocs/luci-static/resources/unifi/icon-data.js
            tools/brand-data-config.json
            tools/brand-data-summary.json
            tools/brand-data-sources.json
            root/usr/share/licenses/luci-theme-unifi/Simple-Icons-*
      - name: Save candidate previews and source comparison reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: brand-data-reports
          path: artifacts/brand-data/
          if-no-files-found: ignore
          retention-days: 30
