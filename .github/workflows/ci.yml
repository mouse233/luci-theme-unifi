name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - name: Unit and packaging tests
        run: |
          node --test tests/*.test.cjs
          python3 -m unittest discover -s tests -p 'test_*.py' -v

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
      - name: Install browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Build the pinned ucode host interpreter
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential pkg-config libjson-c-dev
          git clone https://github.com/jow-/ucode.git vendor/ucode
          git -C vendor/ucode checkout a2c42eac6369a0bba0315007c7dc7b7130275340
          cmake -S vendor/ucode -B vendor/ucode/build -DUBUS_SUPPORT=OFF -DUCI_SUPPORT=OFF -DULOOP_SUPPORT=OFF -DLIB_SEARCH_PATH="$PWD/vendor/ucode/build/*.so"
          cmake --build vendor/ucode/build --parallel 2
      - name: Collector storage and template checks
        run: |
          vendor/ucode/build/ucode tests/activity-store.uc
          vendor/ucode/build/ucode tests/presence-state.uc
          for template in ucode/template/themes/unifi/*.ut; do
            vendor/ucode/build/ucode -T -c,dynlink=luci.core,dynlink=uci -o /dev/null "$template"
          done
      - name: Browser regression tests
        run: |
          mkdir -p artifacts
          python3 tools/preview_server.py > artifacts/preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          python3 - <<'PYTHON'
          import time
          import urllib.request
          for attempt in range(50):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8765/', timeout=1)
                  break
              except OSError:
                  time.sleep(0.1)
          else:
              raise SystemExit('Preview server did not start')
          PYTHON
          npm run test:browser
      - name: Save browser reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-reports-${{ github.sha }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7

  package:
    needs: [unit, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - name: Build IPK
        run: python3 tools/build_package.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: luci-theme-unifi-${{ github.sha }}
          path: artifacts/packages/*.ipk
          if-no-files-found: error
          retention-days: 30
